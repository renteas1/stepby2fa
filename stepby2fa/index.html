<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Doğrulaması</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030711;
        --panel: rgba(7, 14, 33, 0.86);
        --border: rgba(92, 163, 255, 0.35);
        --text: #f3f7ff;
        --muted: #9db0d6;
        --accent: #5fa8ff;
        --accent-2: #3ed7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(95, 168, 255, 0.18), transparent 32%),
          radial-gradient(circle at 80% 10%, rgba(62, 215, 255, 0.16), transparent 28%),
          linear-gradient(135deg, var(--bg), #071126 70%, #02050d);
        color: var(--text);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: -20%;
        pointer-events: none;
        opacity: 0.6;
      }

      body::before {
        background: linear-gradient(90deg, transparent, rgba(95, 168, 255, 0.2), transparent);
        transform: rotate(-12deg);
        animation: beam 8s linear infinite;
      }

      body::after {
        background: linear-gradient(120deg, transparent, rgba(62, 215, 255, 0.18), transparent);
        transform: rotate(10deg);
        animation: beam 10s linear infinite reverse;
      }

      @keyframes beam {
        from { transform: translateX(-30%) rotate(-12deg); }
        to { transform: translateX(30%) rotate(-12deg); }
      }

      .card {
        width: min(92vw, 520px);
        padding: 32px;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(18px);
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(95, 168, 255, 0.1), transparent 38%, rgba(62, 215, 255, 0.15));
        pointer-events: none;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(95, 168, 255, 0.15);
        color: #b8d7ff;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 1px solid rgba(95, 168, 255, 0.24);
      }

      h1 {
        margin: 16px 0 10px;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 0 10px;
        color: var(--muted);
        line-height: 1.6;
      }

      .status {
        margin-top: 16px;
        min-height: 24px;
        color: #bfe7ff;
        font-size: 0.95rem;
      }

      .loader {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0;
        color: #88cbff;
        font-size: 0.95rem;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        animation: pulse 1.2s ease-in-out infinite;
      }

      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes pulse {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.6; }
        40% { transform: scale(1.1); opacity: 1; }
      }

      .g-recaptcha {
        margin-top: 18px;
        display: flex;
        justify-content: center;
      }

      .footer {
        margin-top: 16px;
        font-size: 0.82rem;
        color: #7790b6;
      }

      .info-panel {
        margin-top: 20px;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid rgba(95, 168, 255, 0.2);
        background: rgba(2, 8, 20, 0.48);
      }

      .info-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .view-btn {
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        color: #04111f;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }

      .details {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 0.9rem;
        color: #c8dcff;
      }

      .detail-row code {
        font-family: Consolas, monospace;
        color: #8fd8ff;
        word-break: break-all;
      }

      @media (max-width: 600px) {
        .card { padding: 24px; }
      }
    </style>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </head>
  <body>
    <main class="card">
      <div class="badge">● Renteas Gate Verification</div>
      <h1>Robot doğrulaması</h1>
      <p>Robot olup olmadığın kontrol ediliyor... bip bap bop bib?</p>

      <div class="loader" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>Doğrulama ekranı hazırlanıyor…</span>
      </div>

      <div class="g-recaptcha"
        data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
        data-callback="onCaptchaSuccess"
        data-expired-callback="onCaptchaExpired"></div>

      <div id="status" class="status">Bekleniyor…</div>

      <div class="info-panel">
        <div class="info-actions">
          <span>Network details</span>
          <button class="view-btn" id="viewIpBtn" type="button" onclick="(async () => { const ipDetails = document.getElementById('ipDetails'); const ipValue = document.getElementById('ipValue'); const rayIdValue = document.getElementById('rayIdValue'); if (!ipDetails || !ipValue || !rayIdValue) return; ipDetails.hidden = false; ipValue.textContent = 'Checking...'; rayIdValue.textContent = 'Generating...'; let ip = 'Unavailable'; try { const response = await fetch('https://api.ipify.org?format=json', { method: 'GET', mode: 'cors', headers: { Accept: 'application/json' } }); const data = await response.json(); ip = data && data.ip ? data.ip : 'Unavailable'; } catch (error) { ip = 'Unavailable'; } ipValue.textContent = ip; rayIdValue.textContent = 'ray-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36).slice(-6); })()">View My IP</button>
        </div>
        <div class="details" id="ipDetails" hidden>
          <div class="detail-row"><span>IP</span><code id="ipValue">-</code></div>
          <div class="detail-row"><span>Ray ID</span><code id="rayIdValue">-</code></div>
        </div>
      </div>
    </main>

    <script>
      function onCaptchaSuccess(token) {
        const status = document.getElementById('status');
        status.textContent = 'Doğrulama başarılı. AvolianTech'e yönlendiriliyorsunuz...';
        setTimeout(function () {
          window.location.href = 'https://avoliantech.com';
        }, 1400);
      }

      function onCaptchaExpired() {
        const status = document.getElementById('status');
        status.textContent = 'Doğrulama süresi doldu. Lütfen tekrar deneyin.';
      }

      function generateRayId() {
        const randomValue = Math.random().toString(36).slice(2, 10);
        const timeValue = Date.now().toString(36).slice(-6);
        return 'ray-' + randomValue + '-' + timeValue;
      }

      async function showNetworkDetails() {
        const ipDetails = document.getElementById('ipDetails');
        const ipValue = document.getElementById('ipValue');
        const rayIdValue = document.getElementById('rayIdValue');

        if (!ipDetails || !ipValue || !rayIdValue) {
          return;
        }

        ipDetails.hidden = false;
        ipValue.textContent = 'Checking...';
        rayIdValue.textContent = 'Generating...';

        let ip = 'Unavailable';
        try {
          const response = await fetch('https://api.ipify.org?format=json', {
            method: 'GET',
            mode: 'cors',
            headers: { Accept: 'application/json' }
          });
          const data = await response.json();
          ip = data && data.ip ? data.ip : 'Unavailable';
        } catch (error) {
          ip = 'Unavailable';
        }

        ipValue.textContent = ip;
        rayIdValue.textContent = generateRayId();
      }

      const viewIpBtn = document.getElementById('viewIpBtn');
      if (viewIpBtn) {
        viewIpBtn.addEventListener('click', showNetworkDetails);
      }
    </script>
  </body>
</html>
